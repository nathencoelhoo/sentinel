name: sentinel
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Show build errors
        if: failure()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 60 build.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
  replay:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: cp eval/events.example.json eval/events.json
      - run: npm run eval:fetch -- --events eval/events.json
      - run: npm run eval -- --events eval/events.json --ablate
      - run: cat results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: replay-results
          path: results
