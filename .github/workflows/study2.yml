name: study2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  study2:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unpack update zip
        run: |
          if [ -f sentinel-update2.zip ]; then
            unzip -q -o sentinel-update2.zip -d /tmp/u
            cp -a /tmp/u/. .
            rm sentinel-update2.zip
            git config user.name github-actions
            git config user.email actions@github.com
            git add -A
            git commit -m "Add exploratory study v2" || true
            git push
          fi
      - run: npm install
      - run: npm test
      - run: node eval/study2-select.ts --config eval/study2.json --out eval/events.v2.json
      - run: node eval/fetch.ts --events eval/events.v2.json --warmup-days 7 --tail-hours 12
      - run: node eval/study2-run.ts --config eval/study2.json --events eval/events.v2.json
      - run: cat results/study2/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: study2-results
          path: results
